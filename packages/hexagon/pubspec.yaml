name: hexagon
description: >-
  Hexagons for Flutter apps and games: a hexagon widget and ShapeBorder,
  hex grids, and a pannable, zoomable hex map with painted layers,
  pathfinding and hit testing.
version: 1.0.0
homepage: https://github.com/orlikraf/flutter-hexagon
repository: https://github.com/orlikraf/flutter-hexagon/tree/main/packages/hexagon
issue_tracker: https://github.com/orlikraf/flutter-hexagon/issues
topics:
  - hexagon
  - grid
  - game
  - shape
  - widget
screenshots:
  - description: Hexagon widgets, borders and grids.
    path: example/hexagon_example_1.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hexagon_core: ^1.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
