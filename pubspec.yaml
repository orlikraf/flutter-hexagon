name: hexagon
description: >-
  Hexagon-shaped widgets and hexagonal grids for Flutter: flat or pointy tiles,
  rounded corners, elevation, offset and cube/axial coordinate grids.
version: 0.2.0
repository: https://github.com/orlikraf/flutter-hexagon
issue_tracker: https://github.com/orlikraf/flutter-hexagon/issues
topics:
  - hexagon
  - grid
  - shape
  - widget
  - game

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  uses-material-design: false