name: Publish to pub.dev

# Publishing uses pub.dev automated publishing (GitHub OIDC), so no
# long-lived credentials are stored in this repository.
#
# One-time setup on pub.dev (package admin page, "Automated publishing"):
#   - Enable publishing from GitHub Actions
#   - Repository: orlikraf/flutter-hexagon
#   - Tag pattern: {{version}}
#
# To release: bump `version` in pubspec.yaml, add a matching CHANGELOG entry,
# merge to main, then push a tag equal to the version (e.g. `0.2.1`).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches pubspec version and CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk '/^version:/ {print $2}' pubspec.yaml | tr -d "\"'")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match pubspec.yaml version '$version'."
            exit 1
          fi
          if ! grep -Eq "^## \[?${version//./\\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' entry."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish:
    needs: verify
    permissions:
      id-token: write # Required to request the OIDC token for pub.dev.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
